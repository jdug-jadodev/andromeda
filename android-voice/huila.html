<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viaje al Huila</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,"Segoe UI",Roboto,sans-serif}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{width:100vw;height:calc(100vw*1080/2280);max-height:100vh;max-width:calc(100vh*2280/1080);display:block}
  #bar{display:none}
  #bar button,#bar input{font:inherit}
  #start{display:none}
  #start span{background:#f4b63e;color:#2b1a05;font-weight:800;font-size:28px;padding:18px 34px;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="2280" height="1080"></canvas></div>
<div id="start"><span>▶ Ver el viaje al Huila</span></div>
<div id="bar">
  <button id="replay">↻ Repetir</button>
  <label>Simular hoy <input type="date" id="today"></label>
  <label><input type="checkbox" id="sound" checked> Sonido</label>
</div>
<script>
'use strict';
// Prototype only: Moto G landscape 2280x1080. Countdown to 11 December (Bogotá), the trip to Huila.
// Story: a chiva arrives with five chubby travellers, men in camouflage pop up and fire into the sky,
// the five jump out and run, everybody leaves, then the empty chiva blows up. Cartoon, nobody hurt.
const W = 2280, H = 1080;
const cv = document.getElementById('c');
let g = cv.getContext('2d');

// ---------- timeline (seconds) ----------
// The chiva arrives with the five inside, men in camouflage pop up and fire into the sky, the five jump out
// and run, everybody leaves, then the empty chiva blows up.
const T = { BUS_IN: 0.2, BUS_STOP: 2.6, COUNT: 3.0, SCARE: 3.95, DOOR: 4.25, EXIT: 4.4, EXIT_GAP: .3, DUCK: 6.9, BOOM: 8.6, END: 16 };
const GAP = .085;

// ---------- layout ----------
const HORIZON = 560, VERGE = 690, ROAD_TOP = 800, ROAD_BOT = 955;
const BUS_X = 700, BUS_Y = 888;             // wheel centre line
const DOOR_X = 215;                          // door, bus-local

// The men in camouflage: back row small, front row big. rise = when they pop up; aim = rifle tilt to the sky.
const SOLDIERS = [
  { x: 1690, y: 700, s: .6, rise: 3.52, aim: 1.2 },
  { x: 1960, y: 705, s: .6, rise: 3.32, aim: .92 },
  { x: 2200, y: 718, s: .64, rise: 3.6, aim: 1.15 },
  { x: 1560, y: 742, s: .74, rise: 3.4, aim: 1.02 },
  { x: 1810, y: 800, s: 1, rise: 3.3, aim: .95 },
  { x: 2090, y: 800, s: 1, rise: 3.45, aim: 1.12 },
];
const SHOTS = [];   // { t, who, k }
SOLDIERS.forEach((sd, who) => { for (let b = 0; b < 3; b++) for (let i = 0; i < 5; i++)
  SHOTS.push({ t: sd.rise + .45 + b * .8 + (who % 3) * .1 + i * GAP, who, k: who * 100 + b * 10 + i }); });
SHOTS.sort((a, b) => a.t - b.t);

// The five travellers: three men and two women, all round. seat = their window, 0 at the back.
const PEOPLE = [
  { y: 912, shirt: '#e74c3c', pants: '#34495e', skin: '#e0ac7e', cap: '#2e6fd1', mustache: true },
  { y: 896, female: true, dress: '#ff7eb6', skin: '#c68863', hair: '#1d1410' },
  { y: 918, shirt: '#f9d71c', pants: '#1f4fa3', skin: '#d39a6a', bald: true, number: '10' },
  { y: 900, female: true, dress: '#8e44ad', skin: '#e8b590', hair: '#6b3a1f', ponytail: true },
  { y: 914, shirt: '#3498db', pants: '#c8b48a', skin: '#b97a50', vueltiao: true },
];
// The one nearest the door gets out first.
const exitAt = i => T.EXIT + (PEOPLE.length - 1 - i) * T.EXIT_GAP;

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeBack = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const rnd = (i, k = 0) => { const v = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return v - Math.floor(v); };
function rr(x, y, w, h, r) { g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function poly(pts) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); }
function circle(x, y, r, col) { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }

// ---------- date ----------
function bogotaToday() { return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Bogota' }); }
function daysUntilTrip(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const today = Date.UTC(y, m - 1, d); let target = Date.UTC(y, 11, 11);
  if (today > target) target = Date.UTC(y + 1, 11, 11);
  return Math.round((target - today) / 86400000);
}
const dateInput = document.getElementById('today');
dateInput.value = bogotaToday();

// ---------- static background (drawn once) ----------
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
function drawBackground() {
  const real = g; g = bg.getContext('2d');
  let s = g.createLinearGradient(0, 0, 0, HORIZON + 120);
  s.addColorStop(0, '#6fb9e6'); s.addColorStop(.6, '#b9def0'); s.addColorStop(1, '#f7d9a6');
  g.fillStyle = s; g.fillRect(0, 0, W, H);
  let sun = g.createRadialGradient(1960, 210, 10, 1960, 210, 260);
  sun.addColorStop(0, 'rgba(255,246,200,1)'); sun.addColorStop(.25, 'rgba(255,226,140,.9)'); sun.addColorStop(1, 'rgba(255,226,140,0)');
  g.fillStyle = sun; g.fillRect(1600, 0, 700, 520);
  circle(1960, 210, 70, '#fff6d0');
  g.fillStyle = 'rgba(255,255,255,.85)';
  [[260, 120, 1], [1500, 90, .8], [2150, 380, .6], [880, 210, .55]].forEach(([x, y, k]) => {
    g.beginPath(); g.ellipse(x, y, 120 * k, 38 * k, 0, 0, 7); g.ellipse(x + 70 * k, y - 22 * k, 80 * k, 40 * k, 0, 0, 7);
    g.ellipse(x - 80 * k, y + 5 * k, 70 * k, 28 * k, 0, 0, 7); g.fill();
  });
  let mt = g.createLinearGradient(0, 230, 0, HORIZON);
  mt.addColorStop(0, '#8fa3bb'); mt.addColorStop(1, '#6f8499');
  g.fillStyle = mt; poly([-60, 560, 180, 360, 300, 262, 380, 236, 450, 248, 520, 280, 640, 360, 900, 560]); g.fill();
  g.fillStyle = '#f4f8fc';
  poly([216, 330, 300, 262, 380, 236, 450, 248, 520, 280, 588, 326, 540, 318, 505, 300, 470, 326, 430, 296, 392, 330, 350, 300, 300, 332, 262, 312]); g.fill();
  g.fillStyle = '#86a892';
  g.beginPath(); g.moveTo(0, 560);
  for (let x = 0; x <= W; x += 40) g.lineTo(x, 470 + Math.sin(x / 170) * 34 + Math.sin(x / 63) * 12 + (x < 700 ? 40 : 0));
  g.lineTo(W, 600); g.lineTo(0, 600); g.closePath(); g.fill();
  g.fillStyle = '#5f9a55';
  g.beginPath(); g.moveTo(0, 640);
  for (let x = 0; x <= W; x += 30) g.lineTo(x, 545 + Math.sin(x / 210 + 1) * 26 + Math.sin(x / 90) * 8);
  g.lineTo(W, 700); g.lineTo(0, 700); g.closePath(); g.fill();
  g.fillStyle = '#58a6cc';
  g.beginPath(); g.moveTo(-10, 628);
  for (let x = 0; x <= 1500; x += 30) g.lineTo(x, 628 + Math.sin(x / 260) * 18);
  for (let x = 1500; x >= 0; x -= 30) g.lineTo(x, 662 + Math.sin(x / 260) * 18 + x / 120);
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = 3;
  for (let i = 0; i < 14; i++) { const x = 60 + i * 100; const y = 645 + Math.sin(x / 260) * 18 + x / 240;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + 40, y); g.stroke(); }
  [['#d98a52', 585, 0], ['#c9673c', 615, 2], ['#b3542f', 650, 4]].forEach(([col, base, k]) => {
    g.fillStyle = col; g.beginPath(); g.moveTo(1180, 720);
    for (let x = 1180; x <= W + 20; x += 22) {
      const h = 40 + 55 * Math.abs(Math.sin(x / 75 + k)) + 25 * rnd(x, k);
      g.lineTo(x, base - h * (x < 1300 ? (x - 1180) / 120 : 1));
    }
    g.lineTo(W, 720); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(80,30,15,.28)'; g.lineWidth = 3;
    for (let x = 1220; x < W; x += 34) { g.beginPath(); g.moveTo(x, base - 20 - 40 * rnd(x, k + 9)); g.lineTo(x + 6 * (rnd(x, k) - .5), base + 40); g.stroke(); }
  });
  let vg = g.createLinearGradient(0, VERGE, 0, ROAD_TOP);
  vg.addColorStop(0, '#b9b866'); vg.addColorStop(1, '#949c47');
  g.fillStyle = vg; g.fillRect(0, VERGE, W, ROAD_TOP - VERGE);
  g.strokeStyle = '#7d8a3a'; g.lineWidth = 3;
  for (let i = 0; i < 160; i++) { const x = rnd(i, 3) * W, y = VERGE + 15 + rnd(i, 4) * (ROAD_TOP - VERGE - 20);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - 6, y - 16); g.moveTo(x, y); g.lineTo(x + 5, y - 14); g.stroke(); }
  g.fillStyle = '#4b4b51'; g.fillRect(0, ROAD_TOP, W, ROAD_BOT - ROAD_TOP);
  g.fillStyle = '#e9e9e9'; g.fillRect(0, ROAD_TOP + 6, W, 6); g.fillRect(0, ROAD_BOT - 12, W, 6);
  g.fillStyle = '#f2c230'; for (let x = 0; x < W; x += 150) g.fillRect(x, (ROAD_TOP + ROAD_BOT) / 2 - 4, 85, 8);
  g.fillStyle = '#a2a752'; g.fillRect(0, ROAD_BOT, W, H - ROAD_BOT);
  g.strokeStyle = '#7f8a3c'; g.lineWidth = 4;
  for (let i = 0; i < 120; i++) { const x = rnd(i, 7) * W, y = ROAD_BOT + 25 + rnd(i, 8) * 110;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - 8, y - 24); g.moveTo(x, y); g.lineTo(x + 7, y - 20); g.moveTo(x, y); g.lineTo(x, y - 28); g.stroke(); }
  g.fillStyle = '#8f8676';
  [[300, 1010, 40], [1650, 1040, 30], [2000, 995, 46]].forEach(([x, y, r]) => { g.beginPath(); g.ellipse(x, y, r, r * .55, 0, 0, 7); g.fill(); });
  cactus(1420, 770, 230); cactus(2240, 780, 250); cactus(230, 745, 150);
  g.fillStyle = '#6b6b6b'; g.fillRect(1222, 600, 14, 195); g.fillRect(1322, 600, 14, 195);
  g.fillStyle = '#1f7a45'; g.beginPath(); rr(1140, 545, 280, 125, 14); g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 6; g.beginPath(); rr(1150, 555, 260, 105, 9); g.stroke();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = '600 30px system-ui,Segoe UI,sans-serif';
  g.fillText('Bienvenidos al', 1280, 598); g.font = '900 52px system-ui,Segoe UI,sans-serif'; g.fillText('HUILA', 1280, 648);
  g = real;
}
function cactus(x, base, h) {
  g.fillStyle = '#4f7d3b'; g.strokeStyle = '#3c6330'; g.lineWidth = 4;
  const arm = (ax, ay, dir, len) => { g.beginPath(); rr(ax, ay - len, 30, len, 15); g.fill(); g.stroke();
    g.beginPath(); rr(dir < 0 ? ax : ax - 40, ay - 10, 70, 30, 15); g.fill(); };
  g.beginPath(); rr(x - 24, base - h, 48, h, 24); g.fill(); g.stroke();
  arm(x - 74, base - h * .45, -1, h * .35); arm(x + 44, base - h * .6, 1, h * .3);
  g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(x - 6, base - h + 20); g.lineTo(x - 6, base - 10); g.stroke();
}

// ---------- the chiva ----------
function suitcase(cx, cy, w, h, col, ang) {
  g.save(); g.translate(cx, cy); g.rotate(ang);
  g.strokeStyle = '#3a2a1a'; g.lineWidth = 6; g.beginPath(); g.moveTo(-w * .18, -h / 2); g.lineTo(-w * .18, -h / 2 - 16);
  g.lineTo(w * .18, -h / 2 - 16); g.lineTo(w * .18, -h / 2); g.stroke();
  g.fillStyle = col; g.beginPath(); rr(-w / 2, -h / 2, w, h, 10); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 4; g.stroke();
  g.fillStyle = 'rgba(80,50,25,.75)'; g.fillRect(-w * .3, -h / 2, 9, h); g.fillRect(w * .3 - 9, -h / 2, 9, h);
  circle(w * .05, h * .05, Math.min(w, h) * .12, 'rgba(255,255,255,.8)');
  g.restore();
}
const ROOF_BAGS = [   // bus-local, on the roof rack
  { x: -230, y: -357, w: 120, h: 66, c: '#2f7fd1' },
  { x: -95, y: -352, w: 96, h: 56, c: '#f2b632' },
  { x: 30, y: -360, w: 130, h: 72, c: '#9b59b6' },
  { x: 160, y: -350, w: 90, h: 52, c: '#27ae60' },
];
const WINDOW_X = k => -300 + k * 95;          // left edge of window k, 80 wide
function chiva(x, y, burnt, doorOpen, t) {
  g.save(); g.translate(x, y);
  g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(10, 46, 370, 18, 0, 0, 7); g.fill();
  if (burnt) { g.translate(190, 0); g.rotate(0.04); g.translate(-190, 8); }   // rear sinks: its wheel flew off
  const dark = '#2c2826';
  // roof rack and luggage
  g.fillStyle = burnt ? '#1c1a19' : '#3b2a1e'; g.fillRect(-310, -322, 560, 9);
  for (let px = -300; px <= 240; px += 90) g.fillRect(px, -322, 7, 20);
  if (!burnt) ROOF_BAGS.forEach(b => suitcase(b.x, b.y, b.w, b.h, b.c, 0));
  // passenger box (blue) with painted bands
  g.fillStyle = burnt ? dark : '#2e86de'; g.beginPath(); rr(-330, -305, 600, 200, 16); g.fill();
  if (!burnt) {
    g.fillStyle = '#e74c3c'; g.fillRect(-330, -305, 600, 14);
    for (let zx = -326; zx < 266; zx += 24) { g.fillStyle = '#f9d71c'; g.beginPath(); g.moveTo(zx, -291); g.lineTo(zx + 12, -281); g.lineTo(zx + 24, -291); g.fill(); }
  }
  // windows with the travellers inside
  for (let k = 0; k < 5; k++) {
    const wx = WINDOW_X(k);
    g.fillStyle = burnt ? '#111' : '#3b2a1e'; g.beginPath(); rr(wx, -272, 80, 104, 10); g.fill();
    const p = PEOPLE[k];
    if (!burnt && t < exitAt(k)) {
      g.save(); g.beginPath(); rr(wx, -272, 80, 104, 10); g.clip();
      g.fillStyle = p.female ? p.dress : p.shirt; g.beginPath(); g.ellipse(wx + 40, -170, 40, 30, 0, 0, 7); g.fill();
      const hop = t > T.SCARE ? Math.abs(Math.sin(t * 22 + k)) * 6 : Math.abs(Math.sin(t * 9 + k)) * 2;
      g.save(); g.translate(wx + 36, -42 - hop); g.scale(.78, .78); head(p, t >= T.SCARE + k * .04, t); g.restore();
      g.restore();
    }
  }
  // door: slides open when they get out
  const open = doorOpen ? clamp((t - T.DOOR) / .2) : 0;
  g.fillStyle = '#1e140d'; g.beginPath(); rr(DOOR_X - 35, -272, 72, 250, 8); g.fill();
  if (!burnt) { g.fillStyle = '#f39c12'; g.beginPath(); rr(DOOR_X - 35 - open * 62, -272, 72, 250, 8); g.fill();
    g.fillStyle = '#a6d8ee'; g.beginPath(); rr(DOOR_X - 25 - open * 62, -260, 52, 80, 6); g.fill(); }
  // lower body (yellow) with stripes and the route painted on
  g.fillStyle = burnt ? dark : '#f2c230'; g.beginPath(); rr(-330, -118, 610, 100, 16); g.fill();
  if (!burnt) {
    g.fillStyle = '#e74c3c'; g.fillRect(-330, -104, 540, 12);
    g.fillStyle = '#1f6fd1'; g.fillRect(-330, -86, 540, 10);
    g.fillStyle = '#27ae60'; g.fillRect(-330, -70, 540, 8);
    g.fillStyle = '#7a2a12'; g.font = '900 30px system-ui,sans-serif'; g.textAlign = 'center'; g.fillText('NEIVA · GARZÓN', 0, -32);
  }
  // front: hood, windscreen, bumper, light
  g.fillStyle = burnt ? dark : '#d63a2f'; g.beginPath(); rr(262, -175, 100, 160, 22); g.fill();
  g.fillStyle = burnt ? dark : '#d63a2f'; g.beginPath(); rr(256, -302, 78, 140, 14); g.fill();   // driver's cab
  g.fillStyle = burnt ? '#111' : '#a6d8ee'; g.beginPath(); rr(266, -290, 58, 100, 10); g.fill();
  g.fillStyle = '#2a2a2a'; g.fillRect(255, -30, 115, 16); g.fillRect(-338, -30, 30, 16);
  circle(350, -95, 14, burnt ? '#222' : '#ffe9a8');
  if (!burnt) { g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 4; for (let gy = -150; gy < -110; gy += 10) { g.beginPath(); g.moveTo(300, gy); g.lineTo(355, gy); g.stroke(); } }
  // wheels
  const roll = (x + 700) / 56;
  (burnt ? [190] : [-210, 190]).forEach(wx => {
    circle(wx, 0, 56, '#151515'); circle(wx, 0, 27, burnt ? '#3a3533' : '#c9ccd1');
    g.strokeStyle = burnt ? '#222' : '#7b7f86'; g.lineWidth = 5;
    for (let k = 0; k < 5; k++) { const a = roll + k * 1.2566; g.beginPath(); g.moveTo(wx, 0); g.lineTo(wx + Math.cos(a) * 27, Math.sin(a) * 27); g.stroke(); }
  });
  if (burnt) { g.fillStyle = '#151515'; g.beginPath(); g.ellipse(-230, 22, 44, 12, 0, 0, 7); g.fill(); }
  g.restore();
}

// ---------- the men in camouflage ----------
function camo(pathFn, seed) {
  g.save(); g.beginPath(); pathFn(); g.clip();
  g.fillStyle = '#6b7a3a'; g.fillRect(-400, -500, 800, 600);
  const cols = ['#4a5926', '#8c7b4b', '#2f3a1e', '#a39a68'];
  for (let i = 0; i < 70; i++) { g.fillStyle = cols[i % 4]; g.beginPath();
    g.ellipse(-260 + rnd(i, seed) * 520, -360 + rnd(i, seed + 1) * 380, 10 + rnd(i, seed + 2) * 22, 7 + rnd(i, seed + 3) * 12, rnd(i, seed + 4) * 3, 0, 7); g.fill(); }
  g.restore();
}
function limb(x1, y1, x2, y2, w) {
  const a = Math.atan2(y2 - y1, x2 - x1), dx = Math.sin(a) * w / 2, dy = -Math.cos(a) * w / 2;
  g.moveTo(x1 + dx, y1 + dy); g.lineTo(x2 + dx, y2 + dy); g.lineTo(x2 - dx, y2 - dy); g.lineTo(x1 - dx, y1 - dy); g.closePath();
}
const MUZZLE = [-212, -224], PIVOT = [0, -240];
function muzzleOf(sd, kick) { // world position of the barrel tip, rifle tilted up by sd.aim
  const vx = MUZZLE[0] - PIVOT[0], vy = MUZZLE[1] - PIVOT[1], c = Math.cos(sd.aim), s = Math.sin(sd.aim);
  return [sd.x + kick + sd.s * (PIVOT[0] + vx * c - vy * s), sd.y + sd.s * (PIVOT[1] + vx * s + vy * c)];
}
function soldier(x, y, s, aim, kick) {
  g.save(); g.translate(x + kick, y); g.scale(s, s);
  g.fillStyle = '#3b2a1d'; g.beginPath(); rr(-46, -24, 42, 24, 6); g.fill(); g.beginPath(); rr(4, -24, 42, 24, 6); g.fill();
  camo(() => { rr(-36, -150, 32, 130, 8); rr(8, -150, 32, 130, 8); }, 11);
  camo(() => rr(-50, -282, 100, 148, 22), 21);
  g.fillStyle = '#2b2b22'; g.fillRect(-50, -150, 100, 14);
  g.fillStyle = 'rgba(30,35,15,.45)'; g.fillRect(-38, -225, 30, 30); g.fillRect(4, -225, 30, 30);
  // arms and rifle, tilted to the sky around the shoulder
  g.save(); g.translate(PIVOT[0], PIVOT[1]); g.rotate(aim); g.translate(-PIVOT[0], -PIVOT[1]);
  camo(() => limb(18, -255, -40, -214, 24), 31);
  g.fillStyle = '#5a3a22'; g.beginPath(); rr(0, -236, 74, 26, 8); g.fill();
  g.fillStyle = '#2d2d2d'; g.fillRect(-96, -238, 104, 28); g.fillRect(-68, -252, 34, 12);
  g.save(); g.translate(-64, -212); g.rotate(-0.18); g.fillStyle = '#262626'; g.fillRect(0, 0, 22, 46); g.restore();
  g.fillStyle = '#3d3d3d'; g.fillRect(-158, -234, 64, 20);
  g.fillStyle = '#1b1b1b'; g.fillRect(-208, -228, 52, 8);
  circle(-42, -214, 13, '#c98b5e');
  camo(() => limb(-12, -258, -126, -228, 26), 41);
  circle(-128, -226, 13, '#c98b5e');
  g.restore();
  circle(-6, -312, 33, '#c98b5e');
  g.fillStyle = '#1a1a1a'; g.beginPath(); rr(-44, -322, 36, 12, 5); g.fill();
  g.strokeStyle = '#3b2413'; g.lineWidth = 6; g.beginPath(); g.moveTo(-40, -294); g.lineTo(-18, -296); g.stroke();
  camo(() => { g.arc(-4, -318, 42, Math.PI, 0); g.lineTo(46, -316); g.lineTo(-54, -316); }, 51);
  g.fillStyle = '#3c4721'; g.fillRect(-56, -320, 104, 7);
  g.restore();
}
function bush(x, y, s = 1) {

  const t = start + T.BOOM;
  const src = ac.createBufferSource(); src.buffer = nb; src.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(4200, t); lp.frequency.exponentialRampToValueAtTime(100, t + 2.8);
  const shaper = ac.createWaveShaper(); const curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; curve[i] = Math.tanh(x * 3); } shaper.curve = curve;
  src.connect(lp); lp.connect(shaper); env(ac, shaper, t, 1.7, .008, 4.2).connect(out); src.start(t); src.stop(t + 4.6);
  const sub = ac.createOscillator(); sub.frequency.setValueAtTime(80, t); sub.frequency.exponentialRampToValueAtTime(20, t + 1.4);
  env(ac, sub, t, 1.6, .006, 1.8).connect(out); sub.start(t); sub.stop(t + 2.1);
  const hs = ac.createBufferSource(); hs.buffer = nb; const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2400;
  hs.connect(hp); env(ac, hp, t, .7, .003, .45).connect(out); hs.start(t, 1, .6);
  for (let k = 0; k < 12; k++) { const at = t + 1.0 + rnd(k, 61) * 1.6, c = ac.createBufferSource(); c.buffer = nb;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 600 + rnd(k, 62) * 2200; f.Q.value = 4; c.connect(f);
    env(ac, f, at, .25, .002, .09).connect(out); c.start(at, rnd(k, 63) * 3, .15); }
}

// ---------- play control ----------
let playId = 0, clockFn = () => 0;
function play() {
  document.getElementById('start').style.display = 'none';
  days = daysUntilTrip(dateInput.value);
  const id = ++playId;
  if (master) { try { master.gain.setValueAtTime(0, AC.currentTime); master.disconnect(); } catch (e) {} master = null; }
  if (false) {   // sonido desactivado en la TV (el teléfono ya lo da)
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume();
    const comp = AC.createDynamicsCompressor(); comp.connect(AC.destination);
    master = AC.createGain(); master.gain.value = .8; master.connect(comp);
    const start = AC.currentTime + .15; schedule(AC, master, start); clockFn = () => AC.currentTime - start;
  } else { const p = performance.now(); clockFn = () => (performance.now() - p) / 1000; }
  const loop = () => { if (id !== playId) return; const t = Math.min(clockFn(), T.END); draw(Math.max(0, t)); if (t < T.END) requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
document.getElementById('start').onclick = play;
document.getElementById('replay').onclick = play;
document.getElementById('sound').onchange = e => { if (master) master.gain.value = e.target.checked ? .8 : 0; };
dateInput.onchange = () => { days = daysUntilTrip(dateInput.value); };

// En la TV: arranca solo en cuanto carga la página.
play();

drawBackground();
// Preview a single moment: andromeda-huila-preview.html#t=8.7
const still = /t=([\d.]+)/.exec(location.hash);
if (still) { document.getElementById('start').style.display = 'none'; draw(+still[1]); } else draw(0);
// Bake the sound into a WAV for the phone: andromeda-huila-preview.html#render-audio (scene time = file time).
async function renderAudio() {
  const sr = 44100, ac = new OfflineAudioContext(1, sr * T.END, sr);
  const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
  const m = ac.createGain(); m.gain.value = .8; m.connect(comp); schedule(ac, m, 0);
  const pcm = (await ac.startRendering()).getChannelData(0), n = pcm.length;
  const out = new DataView(new ArrayBuffer(44 + n * 2)), str = (o, v) => [...v].forEach((ch, i) => out.setUint8(o + i, ch.charCodeAt(0)));
  str(0, 'RIFF'); out.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true);
  out.setUint16(22, 1, true); out.setUint32(24, sr, true); out.setUint32(28, sr * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true);
  str(36, 'data'); out.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, pcm[i])) * 32767, true);
  let bin = ''; const bytes = new Uint8Array(out.buffer); for (let i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode(...bytes.subarray(i, i + 32768));
  document.body.innerHTML = '<pre id="wav">' + btoa(bin) + '</pre>';
}
if (location.hash === '#render-audio') renderAudio();
</script>
